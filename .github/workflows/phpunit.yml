name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        testbench: ['^10.12', '^11.3']
        dependency-flags: ['--prefer-lowest --prefer-stable', '--prefer-stable']

    name: P${{ matrix.php }} - TB${{ matrix.testbench }} - ${{ matrix.dependency-flags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction --dev
          composer update ${{ matrix.dependency-flags }} --prefer-dist --no-interaction --no-progress

      - name: Show lowest Laravel version
        if: matrix.dependency-flags == '--prefer-lowest --prefer-stable'
        run: composer show laravel/framework

      - name: Execute tests
        run: composer test -- --order-by random

      - name: Analyse code
        if: matrix.testbench == '^11.3'
        run: composer analyse -- --no-progress
